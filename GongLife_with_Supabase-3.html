function loadState(){try{const raw=localStorage.getItem("gonglife_state");if(raw)return JSON.parse(raw)}catch(e){}return null}
function saveState(s){try{localStorage.setItem("gonglife_state",JSON.stringify(s))}catch(e){}}
function initials(name){return name.split(" ").map(p=>p[0]).join("").slice(0,2).toUpperCase()}
 
function Avatar({person,className,style}){
const url=person&&person.avatarUrl;
if(url)return <div className={className} style={{...style,padding:0}}><img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:"50%",display:"block"}}/></div>;
return <div className={className} style={style}>{initials(person?person.name:"?")}</div>
}
 
function readAndResizeImage(file,maxSize,cb){
const reader=new FileReader();
reader.onload=ev=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>h){if(w>maxSize){h=Math.round(h*maxSize/w);w=maxSize}}else if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize}
const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);cb(canvas.toDataURL("image/jpeg",.85))};img.src=ev.target.result};reader.readAsDataURL(file)
}
function getAllPeople(posts,channelMsgs,profile){const set=new Set();posts.forEach(p=>{if(p.name!==profile.name)set.add(p.name)});Object.values(channelMsgs).forEach(arr=>arr.forEach(m=>{if(m.name!==profile.name)set.add(m.name)}));return Array.from(set).sort()}
function dataUrlToBlob(dataUrl){const [meta,base64]=dataUrl.split(",");const mimeMatch=meta.match(/:(.*?);/);const mime=mimeMatch?mimeMatch[1]:"image/jpeg";const byteString=atob(base64);const bytes=new Uint8Array(byteString.length);for(let i=0;i<byteString.length;i++)bytes[i]=byteString.charCodeAt(i);return new Blob([bytes],{type:mime})}
async function sharePost(post,onCopied){const text=`"${post.text}" — posted by ${post.name} on GongLife`;if(navigator.share){try{const shareData={title:"GongLife post",text};if(post.images&&post.images.length&&navigator.canShare){try{const files=post.images.map((dataUrl,i)=>new File([dataUrlToBlob(dataUrl)],`gonglife-${i}.jpg`,{type:"image/jpeg"}));if(navigator.canShare({files}))shareData.files=files}catch(e){}}await navigator.share(shareData);return}catch(err){if(err&&err.name==="AbortError")return}}try{await navigator.clipboard.writeText(text);onCopied&&onCopied()}catch(e){}}
 
function App(){
const existing=loadState();
const [profile,setProfile]=useState(existing?existing.profile:null);
const [posts,setPosts]=useState(SEED_POSTS);
const [postsLoading,setPostsLoading]=useState(true);
const [channelMsgs,setChannelMsgs]=useState(existing?existing.channelMsgs:SEED_CHANNEL_MSGS);
const [dmMessages,setDmMessages]=useState(existing&&existing.dmMessages?existing.dmMessages:SEED_DMS);
const [dmStatus,setDmStatus]=useState(existing&&existing.dmStatus?existing.dmStatus:SEED_DM_STATUS);
const [calendarEvents,setCalendarEvents]=useState(existing&&existing.calendarEvents?existing.calendarEvents:[]);
const [tab,setTab]=useState("home");
const [activeSpace,setActiveSpace]=useState(null);
const [activeChannel,setActiveChannel]=useState("#general");
const [activeDM,setActiveDM]=useState(null);
const [newMessageOpen,setNewMessageOpen]=useState(false);
 
useEffect(()=>saveState({profile,channelMsgs,dmMessages,dmStatus,calendarEvents}),[profile,channelMsgs,dmMessages,dmStatus,calendarEvents]);

// Load posts from Supabase (falls back to local seed data if not configured/offline)
useEffect(()=>{
if(!profile)return;
if(!supabase){setPostsLoading(false);return}
let cancelled=false;
supabase.from("posts").select("*").order("created_at",{ascending:false}).then(({data,error})=>{
if(cancelled)return;
if(error){console.error("Supabase load posts error:",error);setPostsLoading(false);return}
if(data&&data.length)setPosts(data.map(p=>({...p,liked:false,comments:p.comments||[]})));
setPostsLoading(false)
});
return ()=>{cancelled=true}
},[profile]);

async function createPost(text,images){
const newPost={name:profile.name,faculty:profile.faculty.split(" ")[0],suburb:profile.suburb,text,images:images||[],likes:0,comments:[]};
if(supabase){
const {data,error}=await supabase.from("posts").insert(newPost).select().single();
if(error){console.error("Supabase insert post error:",error);return}
setPosts(prev=>[{...data,liked:false,comments:data.comments||[]},...prev]);
}else{
setPosts(prev=>[{id:Date.now(),...newPost,liked:false},...prev]);
}
}
function toggleLikePost(id){
setPosts(prev=>prev.map(p=>{
if(p.id!==id)return p;
const liked=!p.liked,likes=liked?p.likes+1:p.likes-1;
if(supabase)supabase.from("posts").update({likes}).eq("id",id).then(({error})=>{if(error)console.error("Supabase like update error:",error)});
return {...p,liked,likes}
}))
}
function addCommentToPost(id,text){
setPosts(prev=>prev.map(p=>{
if(p.id!==id)return p;
const comments=[...(p.comments||[]),{id:Date.now(),name:profile.name,text}];
if(supabase)supabase.from("posts").update({comments}).eq("id",id).then(({error})=>{if(error)console.error("Supabase comment update error:",error)});
return {...p,comments}
}))
}
function editPost(id,newText){
setPosts(prev=>prev.map(p=>p.id===id?{...p,text:newText}:p));
if(supabase)supabase.from("posts").update({text:newText}).eq("id",id).then(({error})=>{if(error)console.error("Supabase edit post error:",error)});
}
function deletePost(id){
setPosts(prev=>prev.filter(p=>p.id!==id));
if(supabase)supabase.from("posts").delete().eq("id",id).then(({error})=>{if(error)console.error("Supabase delete post error:",error)});
}

if(!profile)return <Onboarding onDone={setProfile}/>;
 
function openDM(name){if(name===profile.name)return;setDmStatus(prev=>prev[name]?prev:{...prev,[name]:"accepted"});setActiveDM(name);setNewMessageOpen(false)}
function acceptRequest(name){setDmStatus(prev=>({...prev,[name]:"accepted"}))}
function declineRequest(name){setDmStatus(prev=>{const next={...prev};delete next[name];return next});setDmMessages(prev=>{const next={...prev};delete next[name];return next});setActiveDM(null)}
function addEventToCalendar(event){setCalendarEvents(prev=>prev.some(e=>e.id===event.id)?prev:[...prev,event])}
const pendingCount=Object.values(dmStatus).filter(s=>s==="requested").length;
 
const nav=<div className="nav">
<button className={tab==="home"?"active":""} onClick={()=>{setActiveDM(null);setTab("home");setActiveSpace(null)}}><span>⌂</span><small>Home</small></button>
<button className={tab==="spaces"?"active":""} onClick={()=>{setActiveDM(null);setTab("spaces")}}><span>☰</span><small>Spaces</small></button>
<button className={tab==="calendar"?"active":""} onClick={()=>{setActiveDM(null);setTab("calendar")}}><span>▣</span><small>Calendar</small></button>
<button className={tab==="messages"?"active":""} onClick={()=>{setActiveDM(null);setTab("messages");setNewMessageOpen(false)}}><span>✉</span><small>Messages</small>{pendingCount>0&&<span className="nav-badge">{pendingCount}</span>}</button>
<button className={tab==="profile"?"active":""} onClick={()=>{setActiveDM(null);setTab("profile")}}><span>☺</span><small>Profile</small></button>
</div>;
 
if(activeDM)return <div className="phone app-shell"><DMView name={activeDM} dmMessages={dmMessages} setDmMessages={setDmMessages} profile={profile} back={()=>setActiveDM(null)} status={dmStatus[activeDM]||"accepted"} onAccept={()=>acceptRequest(activeDM)} onDecline={()=>declineRequest(activeDM)}/>{nav}</div>;
 
return <div className="phone app-shell">
{tab==="home"&&<Home profile={profile} posts={posts} onCreatePost={createPost} onToggleLike={toggleLikePost} onAddComment={addCommentToPost} onEditPost={editPost} onDeletePost={deletePost} channelMsgs={channelMsgs} openSpaces={()=>setTab("spaces")} openDM={openDM}/>}
{tab==="spaces"&&!activeSpace&&<SpacesList onOpen={s=>{setActiveSpace(s);if(s.channels&&s.channels.length)setActiveChannel(s.channels[0])}}/>}
{tab==="spaces"&&activeSpace&&activeSpace.id!=="sports"&&<ChannelView space={activeSpace} channel={activeChannel} setChannel={setActiveChannel} channelMsgs={channelMsgs} setChannelMsgs={setChannelMsgs} profile={profile} back={()=>setActiveSpace(null)} openDM={openDM}/>}
{tab==="spaces"&&activeSpace&&activeSpace.id==="sports"&&<SportsEventsView back={()=>setActiveSpace(null)} calendarEvents={calendarEvents} onAdd={addEventToCalendar}/>}
{tab==="calendar"&&<CalendarView classRoutine={CLASS_ROUTINE} calendarEvents={calendarEvents}/>}
{tab==="messages"&&!newMessageOpen&&<MessagesInbox profile={profile} dmMessages={dmMessages} dmStatus={dmStatus} onOpen={openDM} onNewMessage={()=>setNewMessageOpen(true)}/>}
{tab==="messages"&&newMessageOpen&&<NewMessageView people={getAllPeople(posts,channelMsgs,profile)} back={()=>setNewMessageOpen(false)} onSelect={openDM}/>}
{tab==="profile"&&<Profile profile={profile} posts={posts} onUpdateProfile={setProfile} onReset={()=>{localStorage.removeItem("gonglife_state");setProfile(null);setChannelMsgs(SEED_CHANNEL_MSGS);setDmMessages(SEED_DMS);setDmStatus(SEED_DM_STATUS);setCalendarEvents([]);setTab("home");setActiveSpace(null);setActiveDM(null);setNewMessageOpen(false)}}/>}
{nav}
</div>
}

<div className="field"><label>Full name</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Alex Nguyen"/></div>
<div className="field"><label>Student ID</label><input value={id} onChange={e=>setId(e.target.value)} placeholder="e.g. 7012345"/></div>
<div className="field"><label>Uni email</label><input value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@uowmail.edu.au"/></div>

<div className="field"><label>Profile photo (optional)</label><div className="onboard-avatar-row"><Avatar person={{name:name||"?",avatarUrl}} className="avatar" style={{width:44,height:44,fontSize:15}}/><label className="upload-btn" htmlFor="onboardAvatarInput">{avatarUrl?"Change photo":"Add photo"}</label><input id="onboardAvatarInput" type="file" accept="image/*" style={{display:"none"}} onChange={handleAvatarFile}/></div></div>
{error&&<p className="err" style={{display:"block"}}>{error}</p>}<button className="primary-btn" onClick={verify}>Verify and join</button><div className="id-note"><span>🛡</span><span>Your ID only confirms you're an enrolled UOW student — it's never shown to other users.</span></div></div></div>
}
 
function Home({profile,posts,onCreatePost,onToggleLike,onAddComment,onEditPost,onDeletePost,channelMsgs,openSpaces,openDM}){
const [draft,setDraft]=useState(""),[draftImages,setDraftImages]=useState([]),[query,setQuery]=useState(""),[openComments,setOpenComments]=useState({}),[commentDrafts,setCommentDrafts]=useState({}),[sharedId,setSharedId]=useState(null),[editingId,setEditingId]=useState(null),[editDraft,setEditDraft]=useState("");const shareTimeoutRef=useRef(null);
function submitPost(){if(!draft.trim()&&!draftImages.length)return;onCreatePost(draft.trim(),draftImages);setDraft("");setDraftImages([])}
function toggleLike(id){onToggleLike(id)}
function startEdit(p){setEditingId(p.id);setEditDraft(p.text||"")}
function cancelEdit(){setEditingId(null);setEditDraft("")}
function saveEdit(id){const text=editDraft.trim();if(!text)return;onEditPost(id,text);setEditingId(null);setEditDraft("")}
function handleDelete(id){if(window.confirm("Delete this post? This can't be undone.")){onDeletePost(id);if(editingId===id){setEditingId(null);setEditDraft("")}}}
function handleComposerImages(e){const files=Array.from(e.target.files||[]),remaining=Math.max(4-draftImages.length,0);files.slice(0,remaining).forEach(file=>readAndResizeImage(file,640,dataUrl=>setDraftImages(prev=>prev.length<4?[...prev,dataUrl]:prev)));e.target.value=""}
function toggleComments(id){setOpenComments(prev=>({...prev,[id]:!prev[id]}))}
function addComment(id){const text=(commentDrafts[id]||"").trim();if(!text)return;onAddComment(id,text);setCommentDrafts(prev=>({...prev,[id]:""}))}
function handleShare(post){sharePost(post,()=>{if(shareTimeoutRef.current)clearTimeout(shareTimeoutRef.current);setSharedId(post.id);shareTimeoutRef.current=setTimeout(()=>setSharedId(null),1800)})}
const q=query.trim().toLowerCase(),isSearching=q.length>0,matchedPeople=isSearching?getAllPeople(posts,channelMsgs,profile).filter(n=>n.toLowerCase().includes(q)):[],matchedPosts=isSearching?posts.filter(p=>p.name.toLowerCase().includes(q)||p.text.toLowerCase().includes(q)):posts;
return <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden",minHeight:0}}><div className="topbar"><h2>Your uni life</h2><Avatar person={profile} className="avatar"/></div><div className="content">
<div className="search-bar"><span className="icon">🔎</span><input placeholder="Search posts or people" value={query} onChange={e=>setQuery(e.target.value)}/>{isSearching&&<button className="clear" onClick={()=>setQuery("")}>✕</button>}</div>
{!isSearching&&<div className="stories">{SEED_SPACES.map(s=><div className="story" key={s.id} onClick={openSpaces}><div className="ring">{s.icon}</div><span>{s.name.split(" ")[0]}</span></div>)}</div>}
{!isSearching&&<div className="composer"><textarea rows="2" placeholder={`What's happening, ${profile.name.split(" ")[0]}? Share an update or a photo of your notes…`} value={draft} onChange={e=>setDraft(e.target.value)}/>{draftImages.length>0&&<div className="draft-images">{draftImages.map((img,i)=><div className="draft-image" key={i}><img src={img} alt=""/><button className="remove" onClick={()=>setDraftImages(prev=>prev.filter((_,x)=>x!==i))}>✕</button></div>)}</div>}<div className="composer-row"><label className="photo-btn" htmlFor="composerImageInput">📷</label><input id="composerImageInput" type="file" accept="image/*" multiple style={{display:"none"}} onChange={handleComposerImages}/><button className="post-btn" onClick={submitPost}>Post</button></div></div>}
{isSearching&&matchedPeople.length>0&&<><p className="inbox-section">People</p>{matchedPeople.map(n=><div className="dm-row" key={n} onClick={()=>openDM(n)}><Avatar person={{name:n}} className="dm-list-avatar"/><div className="dm-row-info"><p className="dm-row-name">{n}</p></div></div>)}</>}
{matchedPosts.map(p=><div className="card" key={p.id}><div className="card-head"><Avatar person={p.name===profile.name?profile:{name:p.name}} className="a"/><div className="who"><p className="name" onClick={()=>openDM(p.name)}>{p.name} · {p.faculty}</p><p className="meta">{p.suburb}</p></div></div>{p.images&&p.images.length>0&&<div className={"post-images count-"+Math.min(p.images.length,4)}>{p.images.slice(0,4).map((img,i)=><img key={i} src={img} alt=""/>)}</div>}{editingId===p.id?<div className="edit-post-box"><textarea rows="2" value={editDraft} onChange={e=>setEditDraft(e.target.value)}/><div className="edit-post-actions"><button className="save-edit-btn" onClick={()=>saveEdit(p.id)}>Save</button><button className="cancel-edit-btn" onClick={cancelEdit}>Cancel</button></div></div>:(p.text&&<div className="card-body">{p.text}</div>)}<div className="card-actions"><div className={"act"+(p.liked?" liked":"")} onClick={()=>toggleLike(p.id)}>♥ {p.likes}</div><div className="act" onClick={()=>toggleComments(p.id)}>💬 {(p.comments&&p.comments.length)?p.comments.length:"comment"}</div><div className="act" onClick={()=>handleShare(p)}>{sharedId===p.id?"✓ copied":"↗ share"}</div>{p.name===profile.name&&editingId!==p.id&&<div className="act" onClick={()=>startEdit(p)}>✎ edit</div>}{p.name===profile.name&&editingId!==p.id&&<div className="act" onClick={()=>handleDelete(p.id)}>🗑 delete</div>}</div>{openComments[p.id]&&<div className="comments-section">{(!p.comments||!p.comments.length)&&<p className="no-comments">No comments yet — be the first to reply.</p>}{(p.comments||[]).map(c=><div className="comment-row" key={c.id}><Avatar person={c.name===profile.name?profile:{name:c.name}} className="comment-avatar"/><div className="comment-body"><span className="comment-name">{c.name}</span>{c.text}</div></div>)}<div className="comment-input-row"><input placeholder="Write a comment…" value={commentDrafts[p.id]||""} onChange={e=>setCommentDrafts(prev=>({...prev,[p.id]:e.target.value}))} onKeyDown={e=>{if(e.key==="Enter")addComment(p.id)}}/><button onClick={()=>addComment(p.id)}>➤</button></div></div>}</div>)}
</div></div>
}
 
function SpacesList({onOpen}){return <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden",minHeight:0}}><div className="topbar"><h2>Spaces</h2></div><div className="content"><div className="space-list">{SEED_SPACES.map(s=><div className="space-row" key={s.id} onClick={()=>onOpen(s)}><div className="dot">{s.icon}</div><div className="info"><p className="n">{s.name}</p><p className="d">{s.desc}</p></div></div>)}</div></div></div>}
 
function SportsEventsView({back,calendarEvents,onAdd}){
const [section,setSection]=useState("free");
function added(id){return calendarEvents.some(e=>e.id===id)}
const items=section==="free"?UOW_FREE_EVENTS:UOW_CLUB_EVENTS;
return <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden",minHeight:0}}><div className="channel-header"><button onClick={back}>←</button><h3 style={{fontSize:"15px"}}>🏉 UOW Sports & Events</h3></div>
<div className="sports-tabs"><button className={"sports-tab"+(section==="free"?" active":"")} onClick={()=>setSection("free")}>Free for all</button><button className={"sports-tab"+(section==="clubs"?" active":"")} onClick={()=>setSection("clubs")}>Clubs</button></div>
<div className="content"><p className="section-note">{section==="free"?"Campus events open to all students.":"Find club activities and add sessions you want to attend."}</p>
{items.map(ev=><div className="event-card" key={ev.id}>{section==="clubs"?<div className="club-line"><div className="club-icon">{ev.icon}</div><div style={{flex:1}}><div className="event-card-top"><div><h3>{ev.club}</h3><p style={{marginTop:2}}>{ev.title}</p></div><button className={"add-cal-btn"+(added(ev.id)?" added":"")} onClick={()=>!added(ev.id)&&onAdd(ev)}>{added(ev.id)?"✓ Added":"+ Calendar"}</button></div><div className="event-date">{formatDate(ev.date)} · {ev.time}</div><p>{ev.location} · {ev.description}</p></div></div>:<><div className="event-card-top"><div><h3>{ev.title}</h3><div className="event-date">{formatDate(ev.date)} · {ev.time}</div></div><button className={"add-cal-btn"+(added(ev.id)?" added":"")} onClick={()=>!added(ev.id)&&onAdd(ev)}>{added(ev.id)?"✓ Added":"+ Calendar"}</button></div><p>{ev.location} · {ev.description}</p></>}</div>)}
</div></div>
}
 
function CalendarView({classRoutine,calendarEvents}){
const today=new Date();const [cursor,setCursor]=useState(new Date(today.getFullYear(),today.getMonth(),1));
const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();
const cells=[];for(let i=0;i<42;i++){let d=i-start+1,cm=m,cy=y,muted=false;if(d<1){d=prevDays+d;cm=m-1;muted=true;if(cm<0){cm=11;cy--}}else if(d>days){d=d-days;cm=m+1;muted=true;if(cm>11){cm=0;cy++}}cells.push({d,m:cm,y:cy,muted})}
function dayClasses(cell){const dow=new Date(cell.y,cell.m,cell.d).getDay();return classRoutine.filter(c=>c.day===dow)}
function dayEvents(cell){const key=`${cell.y}-${String(cell.m+1).padStart(2,"0")}-${String(cell.d).padStart(2,"0")}`;return calendarEvents.filter(e=>e.date===key)}
return <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden",minHeight:0}}><div className="topbar"><h2>Calendar</h2><span style={{fontSize:18}}>🗓️</span></div><div className="content">
<div className="calendar-wrap"><div className="calendar-toolbar"><button onClick={()=>setCursor(new Date(y,m-1,1))}>←</button><h3>{cursor.toLocaleString("en-AU",{month:"long",year:"numeric"})}</h3><button onClick={()=>setCursor(new Date(y,m+1,1))}>→</button></div>
<div className="calendar-grid">{["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=><div className="cal-head" key={x}>{x}</div>)}{cells.map((cell,i)=><div className={"cal-day"+(cell.muted?" muted":"")} key={i}><div className="cal-date">{cell.d}</div>{!cell.muted&&dayClasses(cell).slice(0,2).map(c=><div className="cal-item class" key={c.id}>{c.time} {c.title}</div>)}{!cell.muted&&dayEvents(cell).slice(0,2).map(e=><div className="cal-item event" key={e.id}>{e.time} {e.title}</div>)}</div>)}</div>
<div className="legend"><span className="l-class">Class routine</span><span className="l-event">University event</span></div></div>
<div className="routine-card"><h3>Your class routine</h3>{classRoutine.map(c=><div className="routine-row" key={c.id}><span>{["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][c.day]} · {c.title}</span><span className="routine-meta">{c.time}<br/>{c.location}</span></div>)}</div>
{calendarEvents.length>0&&<div className="routine-card"><h3>Added university events</h3>{calendarEvents.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=><div className="routine-row" key={e.id}><span>{e.title}</span><span className="routine-meta">{formatDate(e.date)}<br/>{e.time}</span></div>)}</div>}
</div></div>
}
 
function formatDate(dateStr){return new Date(dateStr+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"})}
 
function ChannelView({space,channel,setChannel,channelMsgs,setChannelMsgs,profile,back,openDM}){const key=space.id+":"+channel,msgs=channelMsgs[key]||[];const [draft,setDraft]=useState("");const endRef=useRef(null);useEffect(()=>{endRef.current&&endRef.current.scrollIntoView()},[msgs.length,channel]);function send(){if(!draft.trim())return;setChannelMsgs({...channelMsgs,[key]:[...msgs,{name:profile.name,text:draft.trim()}]});setDraft("")}return <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden",minHeight:0}}><div className="channel-header"><button onClick={back}>←</button><h3 style={{fontSize:"15px"}}>{space.icon} {space.name}</h3></div><div className="chan-tabs">{space.channels.map(c=><div key={c} className={"chan-tab"+(c===channel?" active":"")} onClick={()=>setChannel(c)}>{c}</div>)}</div><div className="content">{!msgs.length&&<p style={{padding:"0 20px",fontSize:"13px",color:"var(--ink-soft)"}}>No messages yet — say hi 👋</p>}{msgs.map((x,i)=><div className="msg" key={i}><div className="name" onClick={()=>openDM(x.name)}>{x.name}</div><div className="text">{x.text}</div></div>)}<div ref={endRef}/></div><div className="msg-input"><input placeholder={`Message ${channel}`} value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")send()}}/><button onClick={send}>➤</button></div></div>}
 
function DMView({name,dmMessages,setDmMessages,profile,back,status,onAccept,onDecline}){const msgs=dmMessages[name]||[];const [draft,setDraft]=useState("");const endRef=useRef(null);const isPending=status==="requested";useEffect(()=>{endRef.current&&endRef.current.scrollIntoView()},[msgs.length]);function send(){if(!draft.trim()||isPending)return;setDmMessages({...dmMessages,[name]:[...msgs,{from:profile.name,text:draft.trim()}]});setDraft("")}return <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden",minHeight:0}}><div className="channel-header"><button onClick={back}>←</button><Avatar person={{name}} className="dm-list-avatar" style={{width:28,height:28,fontSize:11}}/><h3 style={{fontSize:"15px"}}>{name}</h3></div><div className="content">{!msgs.length&&<p className="dm-empty">{isPending?`${name.split(" ")[0]} sent you a message request`:`No messages yet — send ${name.split(" ")[0]} a hello 👋`}</p>}<div className="dm-body">{msgs.map((x,i)=>{const me=x.from===profile.name;return <div className={"dm-bubble-row"+(me?" me":"")} key={i}><div className="dm-bubble">{x.text}</div></div>})}</div><div ref={endRef}/></div>{isPending?<div className="request-bar"><p>Accept the request to reply to {name.split(" ")[0]}.</p><div className="request-actions"><button className="accept-btn" onClick={onAccept}>Accept</button><button className="decline-btn" onClick={onDecline}>Decline</button></div></div>:<div className="msg-input"><input placeholder={`Message ${name.split(" ")[0]}`} value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")send()}}/><button onClick={send}>➤</button></div>}</div>}
 
function MessagesInbox({profile,dmMessages,dmStatus,onOpen,onNewMessage}){const all=Array.from(new Set([...Object.keys(dmMessages),...Object.keys(dmStatus)])),requests=all.filter(n=>dmStatus[n]==="requested"),active=all.filter(n=>dmStatus[n]!=="requested");function preview(n){const arr=dmMessages[n]||[];if(!arr.length)return dmStatus[n]==="requested"?"New message request":"Say hi 👋";const last=arr[arr.length-1];return (last.from===profile.name?"You: ":"")+last.text}return <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden",minHeight:0}}><div className="topbar"><h2>Messages</h2><button className="new-dm-btn" onClick={onNewMessage}>✎ New</button></div><div className="content">{requests.length>0&&<><p className="inbox-section">Message requests · {requests.length}</p>{requests.map(n=><div className="dm-row" key={n} onClick={()=>onOpen(n)}><Avatar person={{name:n}} className="dm-list-avatar"/><div className="dm-row-info"><p className="dm-row-name">{n}</p><p className="dm-row-preview">{preview(n)}</p></div><span className="req-badge">Request</span></div>)}</>}<p className="inbox-section">Messages</p>{active.map(n=><div className="dm-row" key={n} onClick={()=>onOpen(n)}><Avatar person={{name:n}} className="dm-list-avatar"/><div className="dm-row-info"><p className="dm-row-name">{n}</p><p className="dm-row-preview">{preview(n)}</p></div></div>)}</div></div>}
 
function NewMessageView({people,back,onSelect}){return <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden",minHeight:0}}><div className="channel-header"><button onClick={back}>←</button><h3 style={{fontSize:"15px"}}>New message</h3></div><div className="content">{people.map(p=><div className="dm-row" key={p} onClick={()=>onSelect(p)}><Avatar person={{name:p}} className="dm-list-avatar"/><div className="dm-row-info"><p className="dm-row-name">{p}</p></div></div>)}</div></div>}
 
function Profile({profile,posts,onReset,onUpdateProfile}){const myPosts=posts.filter(p=>p.name===profile.name).length;function handleAvatarFile(e){const file=e.target.files&&e.target.files[0];if(!file)return;readAndResizeImage(file,240,dataUrl=>onUpdateProfile({...profile,avatarUrl:dataUrl}));e.target.value=""}function removeAvatar(){const next={...profile};delete next.avatarUrl;onUpdateProfile(next)}return <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden",minHeight:0}}><div className="topbar"><h2>Profile</h2></div><div className="content"><div className="profile"><div className="profile-head"><div className="avatar-edit-wrap"><Avatar person={profile} className="big-a"/><label className="avatar-edit-btn" htmlFor="profileAvatarInput">✎</label><input id="profileAvatarInput" type="file" accept="image/*" style={{display:"none"}} onChange={handleAvatarFile}/></div><div><h3>{profile.name}</h3><p className="sub">{profile.faculty} · {profile.suburb}</p><p className="sub">ID {profile.id}</p>{profile.avatarUrl&&<p className="remove-photo" onClick={removeAvatar}>Remove photo</p>}</div></div><div className="stat-row"><div className="stat"><div className="num">{SEED_SPACES.length}</div><div className="lbl">Spaces joined</div></div><div className="stat"><div className="num">{myPosts}</div><div className="lbl">Posts</div></div><div className="stat"><div className="num">Week 1</div><div className="lbl">O-Week status</div></div></div><button className="reset-btn" onClick={onReset}>Log out & reset demo data</button></div></div></div>}
 
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
